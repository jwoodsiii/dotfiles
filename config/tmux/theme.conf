# ── Subliminal Nightfall for tmux ────────────────────────────────────────────
# Sourced last in tmux.conf — overrides gmux's Tokyo Night defaults.
# Add to the bottom of ~/dotfiles/config/tmux/tmux.conf:
#   source-file ~/dotfiles/config/tmux/theme.conf
#
# Palette reference:
#   background   #191724    deep indigo
#   foreground   #e0def4    soft lavender
#   selection-bg #484e5b    dim slate
#   teal/cyan    #5fb3b3    palette 6/14  (cursor color — used as primary accent)
#   blue         #6699cc    palette 4
#   bright-blue  #89bcef    palette 12
#   green        #a9cfa4    palette 2
#   yellow       #ffe2a9    palette 3
#   magenta      #f1a5ab    palette 5
#   muted-gray   #7f7f7f    palette 0/8

# ── Status bar base ───────────────────────────────────────────────────────────
# bg=default inherits terminal background so opacity/blur shows through.
set -g status-style "fg=#e0def4,bg=default"

# ── Window tabs ───────────────────────────────────────────────────────────────
# Inactive: muted gray text on transparent
set -g window-status-style          "fg=#7f7f7f,bg=default"
# Active: dark bg on teal accent — matches cursor color for visual coherence
set -g window-status-current-style  "fg=#191724,bg=#5fb3b3,bold"
# Bell: yellow warning
set -g window-status-bell-style     "fg=#191724,bg=#ffe2a9,bold"
# Activity in background window: soft magenta
set -g window-status-activity-style "fg=#191724,bg=#f1a5ab"

# ── Pane borders ──────────────────────────────────────────────────────────────
# Inactive: dim slate — visible but not distracting
set -g pane-border-style        "fg=#484e5b"
# Active: teal accent — matches the active window tab
set -g pane-active-border-style "fg=#5fb3b3"

# ── Messages (tmux command prompt) ────────────────────────────────────────────
# Info/confirmation: yellow — warm, readable
set -g message-style         "fg=#191724,bg=#ffe2a9"
# Command mode (after prefix :): blue
set -g message-command-style "fg=#191724,bg=#6699cc"

# ── Copy mode selection ───────────────────────────────────────────────────────
# Uses theme's selection colors directly
set -g mode-style "fg=#ffffff,bg=#484e5b"

# Subliminal-nightfall inline color fixes for status-left/right
# 水 icon → teal accent, session name/indicators → soft lavender foreground
set -g status-left " #[fg=#5fb3b3]水#[fg=#e0def4]#S  "
set -g status-right "#{?client_prefix,#[fg=#e0def4]⬛ ,}#{?pane_synchronized,#[fg=#e0def4]== ,}"

set -g window-style        'bg=default'
set -g window-active-style 'bg=default'
